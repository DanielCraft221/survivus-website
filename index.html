<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Survivus | Discord, E-mail e Suporte</title>
    <meta
      name="description"
      content="Survivus - Acesse nosso servidor de Discord, servidor de e-mail e canais de suporte."
    />
    <meta name="geo.country" content="BR" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <link rel="preload" href="./assets/images/survivus-logo.png" as="image" />
    <link rel="preload" href="./assets/images/background.webp" as="image" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <img
          src="./assets/images/survivus-logo.png"
          alt="Survivus"
          class="logo"
          fetchpriority="high"
        />
        <h1 class="title">Bem-vindo/a</h1>
        <p class="description">
          Você pode entrar em contato conosco ou acessar as outras áreas deste
          site usando os botões abaixo.
        </p>
      </header>

      <nav class="social-container" aria-label="Links de contato">
        <a
          href="https://discord.gg/..."
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
          aria-expanded="false"
        >
          <img
            src="./assets/images/discord-logo.png"
            alt=""
            class="social-btn__icon social-btn__icon--discord"
            width="50"
            height="50"
          />
          <span class="social-btn__label">Servidor de Discord</span>
        </a>

        <a
          href="https://mail.survivus.com.br"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
          aria-expanded="false"
        >
          <img
            src="./assets/images/mail-server-logo.png"
            alt=""
            class="social-btn__icon"
            width="50"
            height="50"
          />
          <span class="social-btn__label">Servidor de E-mail</span>
        </a>

        <a
          href="mailto:contato@survivus.com.br"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
          aria-expanded="false"
        >
          <img
            src="./assets/images/email-logo.png"
            alt=""
            class="social-btn__icon"
            width="50"
            height="50"
          />
          <span class="social-btn__label">E-mail</span>
        </a>
      </nav>
    </main>
    <script src="script.js" defer></script>

    <script>
      window.si =
        window.si ||
        function () {
          (window.siq = window.siq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
