          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
          aria-expanded="false"
        >

            src="./assets/images/mail-server-logo.png"
            alt=""
            class="social-btn__icon"
            width="50"
            height="50"
          />
          <span class="social-btn__label">Servidor de E-mail</span>
        </a>

          href="mailto:contato@survivus.com.br"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
